<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GermplasmPro · User’s Manual</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../manual.css">
<style>
  .cover { background: #ffffff; }
  .cover text { font-kerning: normal; }
</style>
</head>
<body>

<section class="page cover" aria-label="Cover">
  <svg id="cover" viewBox="0 0 850 1100" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="Cover of the GermplasmPro manual: in the center, the label of an accession from the example collection —MEX-ZM-0001, Maíz azul de Apoala— with its barcode, surrounded by the five conservation routes of the program: the seed jar in cold storage, the field genebank, the in vitro culture jar, the liquid-nitrogen tank with its cryovial and the population in its own site; at the sides, blue maize, common bean, squash, espadín agave, chayote, avocado, cacao and tree chili, each with its scientific name; below, four vignettes of the program: the viability curve of a seed lot, a label with a barcode and a QR code, the core collection and the grid of collecting gaps with its route."></svg>
</section>

<script>
/* La portada se dibuja una sola vez, con semilla fija, como gráficos vectoriales: imprime nítida a
   cualquier tamaño y todas las ilustraciones son originales, hechas con código para este manual.
   La accesión del centro es la primera de la colección de ejemplo del programa (js/examples.js);
   los colores de las cinco rutas son los de la aplicación (css/style.css) y los de la franja del
   pie, los de los capítulos (manual/interior.css). */
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('cover');
  const el = (tag, attrs, parent, text) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    (parent || svg).appendChild(n);
    return n;
  };
  const rng = (seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(20261001);

  const W = 850, H = 1100;
  const TINTA = '#111111', GRIS = '#5f5a66', PAPEL = '#ffffff';
  /* la paleta de la app: morado de maíz azul, ocre de mazorca y verde de chayote */
  const MORADO = '#6b4a8f', MORADO_OSC = '#4e3a75', OCRE = '#c5761c', ORO = '#d3a01c', CHAYOTE = '#5f9e4a',
    TIERRA = '#8a6a45', CIELO = '#2f7fb4', VERDE = '#3d8f4f', MAGENTA = '#a8437e', ROJO = '#b5352b', INDIGO = '#4e4382';
  /* los colores de los capítulos (--b0 … --b10 y --bx), que también son la franja del pie */
  const BLOQUES = ['#4e3a75', '#6b4a8f', '#2f7fb4', '#b5352b', '#8a6a45', '#3d8f4f', '#c5761c', '#a8437e', '#4f8a3c', '#9a7414', '#4e4382', '#111111'];

  const f1 = v => (+v).toFixed(1);
  const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
  const rampa = (stops, t) => { const n = stops.length - 1, x = Math.max(0, Math.min(1, t)) * n, i = Math.min(n - 1, Math.floor(x)); return mix(stops[i], stops[i + 1], x - i); };
  const rad = d => d * Math.PI / 180;
  const poly = pts => 'M' + pts.map(([x, y]) => f1(x) + ' ' + f1(y)).join('L');
  const cerrar = pts => poly(pts) + 'Z';

  const defs = el('defs');
  function grad(kind, id, stops, attrs) {
    const g = el(kind, Object.assign({ id }, attrs), defs);
    stops.forEach(([off, c, op]) => el('stop', { offset: off, 'stop-color': c, 'stop-opacity': op == null ? 1 : op }, g));
    return `url(#${id})`;
  }
  const radial = (id, stops, a) => grad('radialGradient', id, stops, Object.assign({ cx: '50%', cy: '50%', r: '58%', fx: '34%', fy: '30%' }, a));
  const linear = (id, stops, a) => grad('linearGradient', id, stops, Object.assign({ x1: 0, y1: 0, x2: 1, y2: 1 }, a));
  let clipN = 0;
  const clipCirculo = (cx, cy, r) => { const id = 'cl' + (++clipN); el('circle', { cx, cy, r }, el('clipPath', { id }, defs)); return `url(#${id})`; };

  /* ------------------------------------------------------------------ tipografía */
  const SERIF = "'Cormorant', 'Palatino Linotype', serif";
  const SANS = "'Jost', 'Segoe UI', system-ui, sans-serif";
  const txt = (x, y, s, o = {}) => el('text', Object.assign({
    x, y, 'font-family': o.sans ? SANS : SERIF, 'font-size': o.size || 12, 'font-weight': o.peso || 400,
    'font-style': o.cursiva ? 'italic' : null, fill: o.color || TINTA, 'text-anchor': o.ancla || 'start',
    'letter-spacing': o.esp || null, opacity: o.op || null,
  }), o.padre, s);

  el('rect', { x: 0, y: 0, width: W, height: H, fill: PAPEL });

  /* ============================================================ fondo: surcos de una parcela */
  /* Líneas onduladas muy tenues, como los surcos de una parcela de regeneración vistos desde arriba. */
  const fondo = el('g', { 'aria-hidden': 'true' });
  function surcos(x0, y0, n, largo, ang, color) {
    for (let i = 0; i < n; i++) {
      const pts = [];
      for (let t = 0; t <= largo; t += 8) {
        const u = t, v = i * 17 + Math.sin(t / 37 + i * 0.6) * 3.2;
        pts.push([x0 + u * Math.cos(rad(ang)) - v * Math.sin(rad(ang)), y0 + u * Math.sin(rad(ang)) + v * Math.cos(rad(ang))]);
      }
      el('path', { d: poly(pts), fill: 'none', stroke: color, 'stroke-width': 0.9, opacity: Math.max(0.012, 0.085 - i * 0.0075) }, fondo);
    }
  }
  surcos(-40, 150, 11, 420, -38, MORADO);
  surcos(890, 905, 11, 430, 142, CHAYOTE);

  /* ============================================================ encabezado */
  el('rect', { x: 68, y: 66, width: 714, height: 2.2, fill: TINTA });
  txt(68, 40, 'USER’S MANUAL', { sans: true, size: 10.5, peso: 500, esp: '0.34em', color: MORADO_OSC });
  txt(68, 58, 'Manual de usuario', { size: 13, cursiva: true, color: GRIS });
  txt(782, 58, 'ENGLISH EDITION', { sans: true, size: 10.5, peso: 400, esp: '0.34em', color: GRIS, ancla: 'end' });

  /* ============================================================ título */
  const t1 = txt(64, 160, '', { size: 96, peso: 600, color: TINTA });
  el('tspan', {}, t1, 'Germplasm');
  el('tspan', { fill: MORADO }, t1, 'Pro');
  txt(782, 158, 'version 1.0.0', { sans: true, size: 11, peso: 400, color: GRIS, ancla: 'end' });
  el('rect', { x: 68, y: 186, width: 714, height: 1.2, fill: '#dcd3e6' });
  [MORADO, OCRE, CHAYOTE].forEach((c, i) => el('circle', { cx: 760 + i * 10, cy: 186.6, r: 3.2, fill: c }));
  txt(68, 228, 'The genebank, accession by accession', { size: 27, peso: 500, color: TINTA });
  txt(68, 255, 'El banco de germoplasma, accesión por accesión', { size: 18.5, peso: 400, cursiva: true, color: GRIS });

  /* ============================================================ las cinco rutas alrededor de una accesión */
  const CX = 425, CY = 548, R = 178, RM = 54;
  /* halo y una retícula de colecta con puntos, recortada en círculo */
  const halo = radial('gHalo', [['0%', '#f3eef8'], ['62%', '#f8f5fb'], ['100%', '#ffffff', 0]], { fx: '50%', fy: '50%', r: '50%' });
  el('circle', { cx: CX, cy: CY, r: 262, fill: halo });
  const ret = el('g', { 'clip-path': clipCirculo(CX, CY, 238), 'aria-hidden': 'true' });
  for (let x = CX - 238; x <= CX + 238; x += 26) el('line', { x1: f1(x), y1: CY - 240, x2: f1(x), y2: CY + 240, stroke: MORADO, 'stroke-width': 0.5, opacity: 0.12 }, ret);
  for (let y = CY - 238; y <= CY + 238; y += 26) el('line', { x1: CX - 240, y1: f1(y), x2: CX + 240, y2: f1(y), stroke: MORADO, 'stroke-width': 0.5, opacity: 0.12 }, ret);
  const COLRUTA = [OCRE, CHAYOTE, ORO, CIELO, VERDE];
  for (let i = 0; i < 70; i++) {
    const a = rng() * Math.PI * 2, r = 70 + Math.sqrt(rng()) * 165;
    el('circle', { cx: f1(CX + Math.cos(a) * r), cy: f1(CY + Math.sin(a) * r), r: f1(1.6 + rng() * 1.2), fill: COLRUTA[i % 5], opacity: 0.32 }, ret);
  }
  el('circle', { cx: CX, cy: CY, r: R, fill: 'none', stroke: '#cbbfda', 'stroke-width': 1, 'stroke-dasharray': '1.5 5', 'stroke-linecap': 'round' });

  /* ---------------------------------------------------------------- dibujos de las rutas (centrados en 0,0, radio ≈ 50) */
  function rutaSemillas(g, c) {
    /* frasco de vidrio en cámara fría, lleno de granos de colores */
    const vidrio = linear('gVidrio', [['0%', '#ffffff', 0.9], ['45%', '#eef3f7', 0.7], ['100%', '#d8e2ea', 0.85]], { x1: 0, y1: 0, x2: 1, y2: 0 });
    const tapa = linear('gTapa', [['0%', mix(c, '#ffffff', 0.35)], ['100%', mix(c, '#000000', 0.2)]], { x1: 0, y1: 0, x2: 0, y2: 1 });
    el('rect', { x: -24, y: -20, width: 48, height: 56, rx: 9, fill: vidrio, stroke: '#9fb0be', 'stroke-width': 1 }, g);
    const granos = el('g', { 'clip-path': (() => { const id = 'clFrasco'; el('rect', { x: -22, y: -18, width: 44, height: 52, rx: 8 }, el('clipPath', { id }, defs)); return `url(#${id})`; })() }, g);
    const COLS = ['#4e4382', '#6b3a6e', '#e0ab21', '#eee2c4', '#a8382f', '#c98a4a'];
    for (let fila = 0; fila < 9; fila++) for (let k = 0; k < 8; k++) {
      const x = -21 + k * 6 + (fila % 2) * 3, y = 32 - fila * 4.6;
      const col = COLS[Math.floor(rng() * COLS.length)];
      el('ellipse', { cx: f1(x), cy: f1(y), rx: 3, ry: 2.5, fill: col, stroke: mix(col, '#000000', 0.3), 'stroke-width': 0.35, transform: `rotate(${f1(rng() * 60 - 30)} ${f1(x)} ${f1(y)})` }, granos);
    }
    el('rect', { x: -15, y: -10, width: 30, height: 13, rx: 2, fill: '#ffffff', stroke: '#c9c2d4', 'stroke-width': 0.6 }, g);
    for (let i = 0; i < 14; i++) el('rect', { x: f1(-12 + i * 1.75), y: -7.5, width: i % 3 ? 0.8 : 1.3, height: 8, fill: TINTA }, g);
    el('rect', { x: -9, y: 36, width: 2, height: 2, fill: 'none' }, g);
    el('path', { d: 'M-17 -14 L-17 28', stroke: '#ffffff', 'stroke-width': 2.4, opacity: 0.7, 'stroke-linecap': 'round' }, g);
    el('rect', { x: -27, y: -31, width: 54, height: 12, rx: 3, fill: tapa, stroke: mix(c, '#000000', 0.35), 'stroke-width': 0.7 }, g);
    for (let i = 0; i < 9; i++) el('line', { x1: -23 + i * 5.7, y1: -29, x2: -23 + i * 5.7, y2: -21, stroke: mix(c, '#000000', 0.3), 'stroke-width': 0.5, opacity: 0.6 }, g);
    /* copo: la cámara a −18 °C */
    const fl = el('g', { transform: 'translate(35 -12)', stroke: CIELO, 'stroke-width': 1.4, 'stroke-linecap': 'round' }, g);
    for (let k = 0; k < 3; k++) { el('line', { x1: -7, y1: 0, x2: 7, y2: 0, transform: `rotate(${k * 60})` }, fl); }
    for (let k = 0; k < 6; k++) el('path', { d: 'M4.5 0 l2 -1.6 M4.5 0 l2 1.6', fill: 'none', transform: `rotate(${k * 60})` }, fl);
  }
  function rutaCampo(g, c) {
    /* colección viva: hileras de árboles sobre el terreno, con su estaca de identificación */
    el('rect', { x: -60, y: -60, width: 120, height: 120, fill: '#f6faf2' }, g);
    el('path', { d: 'M-60 -2 C-20 -10 20 -10 60 -4 L60 60 L-60 60 Z', fill: mix(c, '#ffffff', 0.55) }, g);
    for (let i = 0; i < 5; i++) {
      const y = 4 + i * 9.5;
      el('path', { d: `M-60 ${y} C-20 ${y - 4} 20 ${y - 4} 60 ${y}`, fill: 'none', stroke: mix(c, '#000000', 0.15), 'stroke-width': 0.8, opacity: 0.45 }, g);
    }
    const copa = radial('gCopa', [['0%', '#b9dc8e'], ['55%', c], ['100%', mix(c, '#000000', 0.35)]], { r: '60%', fx: '35%', fy: '30%' });
    [[-6, 0.62, 3], [6, 0.82, 3], [22, 1.0, 3]].forEach(([y, s, n]) => {
      for (let k = 0; k < n; k++) {
        const x = (k - (n - 1) / 2) * 34 * s;
        el('rect', { x: f1(x - 1.6 * s), y: f1(y - 6 * s), width: f1(3.2 * s), height: f1(10 * s), fill: TIERRA }, g);
        el('circle', { cx: f1(x), cy: f1(y - 15 * s), r: f1(12 * s), fill: copa }, g);
        el('circle', { cx: f1(x - 7 * s), cy: f1(y - 9 * s), r: f1(7.5 * s), fill: copa }, g);
        el('circle', { cx: f1(x + 7 * s), cy: f1(y - 10 * s), r: f1(7 * s), fill: copa }, g);
      }
    });
    /* estaca con etiqueta */
    el('rect', { x: 26, y: 26, width: 2.2, height: 18, fill: TIERRA }, g);
    el('rect', { x: 19, y: 20, width: 16, height: 9, rx: 1.2, fill: '#ffffff', stroke: TIERRA, 'stroke-width': 0.7 }, g);
    for (let i = 0; i < 7; i++) el('rect', { x: 21 + i * 1.8, y: 22, width: i % 2 ? 0.7 : 1.1, height: 5, fill: TINTA }, g);
  }
  function rutaInVitro(g, c) {
    /* frasco de cultivo de crecimiento lento con una plántula, y un tubo a su lado */
    const vidrio = linear('gVidrioIv', [['0%', '#ffffff', 0.95], ['50%', '#f1f5f8', 0.75], ['100%', '#dbe5ec', 0.9]], { x1: 0, y1: 0, x2: 1, y2: 0 });
    const agar = linear('gAgar', [['0%', '#fbf0b8'], ['100%', '#ead47a']], { x1: 0, y1: 0, x2: 0, y2: 1 });
    el('rect', { x: -26, y: -22, width: 40, height: 58, rx: 6, fill: vidrio, stroke: '#9fb0be', 'stroke-width': 1 }, g);
    el('rect', { x: -24.5, y: 18, width: 37, height: 16.5, rx: 4.5, fill: agar }, g);
    el('path', { d: 'M-6 18 C-6 8 -5 -2 -6 -10', fill: 'none', stroke: '#5f8f3a', 'stroke-width': 1.6, 'stroke-linecap': 'round' }, g);
    [[-6, 8, -1], [-6, 2, 1], [-6, -4, -1], [-6, -9, 1]].forEach(([x, y, d], i) =>
      el('path', { d: `M${x} ${y} q ${d * 8} ${-6 + i} ${d * 13} ${-2 + i}  q ${-d * 6} 6 ${-d * 13} ${2 - i} Z`, fill: mix('#7cb44e', '#3f7a2b', i * 0.15) }, g));
    el('path', { d: 'M-7 18 q -4 6 -8 9 M-5 18 q 2 7 6 10 M-6 18 l -1 9', fill: 'none', stroke: '#f0e6c8', 'stroke-width': 0.9 }, g);
    el('path', { d: 'M-20 -16 L-20 28', stroke: '#ffffff', 'stroke-width': 2.2, opacity: 0.8, 'stroke-linecap': 'round' }, g);
    el('rect', { x: -28, y: -31, width: 44, height: 10, rx: 2.5, fill: linear('gTapaIv', [['0%', mix(c, '#ffffff', 0.3)], ['100%', mix(c, '#000000', 0.15)]], { x1: 0, y1: 0, x2: 0, y2: 1 }), stroke: mix(c, '#000000', 0.3), 'stroke-width': 0.7 }, g);
    /* tubo de ensayo */
    const tb = el('g', { transform: 'translate(28 4) rotate(8)' }, g);
    el('path', { d: 'M-6 -26 L-6 22 A6 6 0 0 0 6 22 L6 -26 Z', fill: vidrio, stroke: '#9fb0be', 'stroke-width': 0.9 }, tb);
    el('path', { d: 'M-5.2 12 L-5.2 22 A5.2 5.2 0 0 0 5.2 22 L5.2 12 Z', fill: agar }, tb);
    el('path', { d: 'M0 12 C0 6 1 2 0 -4', fill: 'none', stroke: '#5f8f3a', 'stroke-width': 1.1 }, tb);
    el('ellipse', { cx: 2.6, cy: 0, rx: 3.4, ry: 1.6, fill: '#6fa646', transform: 'rotate(-30 2.6 0)' }, tb);
    el('ellipse', { cx: -2.6, cy: 4, rx: 3.2, ry: 1.5, fill: '#6fa646', transform: 'rotate(30 -2.6 4)' }, tb);
    el('rect', { x: -7.5, y: -32, width: 15, height: 7, rx: 1.5, fill: mix(c, '#ffffff', 0.15) }, tb);
  }
  function rutaCrio(g, c) {
    /* tanque de nitrógeno líquido con vapor, y un criotubo delante */
    const acero = linear('gAcero', [['0%', '#c5ced8'], ['35%', '#f4f7fa'], ['70%', '#b3becb'], ['100%', '#8f9cab']], { x1: 0, y1: 0, x2: 1, y2: 0 });
    el('path', { d: 'M-30 -8 C-30 -20 -14 -22 -11 -26 L-11 -34 L11 -34 L11 -26 C14 -22 30 -20 30 -8 L30 34 C30 40 -30 40 -30 34 Z', fill: acero, stroke: '#7d8a99', 'stroke-width': 1 }, g);
    el('rect', { x: -14, y: -40, width: 28, height: 7, rx: 2, fill: mix(c, '#000000', 0.1) }, g);
    el('path', { d: 'M-30 8 L30 8 M-30 26 L30 26', stroke: '#8f9cab', 'stroke-width': 0.8, opacity: 0.7 }, g);
    txt(0, 20.5, 'LN₂', { sans: true, size: 10, peso: 600, color: mix(c, '#000000', 0.25), ancla: 'middle', padre: g });
    /* vapor */
    [[-6, 0], [4, 0.6], [12, 1.2]].forEach(([x, f]) =>
      el('path', { d: `M${x} -42 c ${-6 + f} -5 ${5 - f} -9 ${-1 + f} -15 c ${-4} -4 ${3} -7 ${0} -11`, fill: 'none', stroke: '#9fc6e2', 'stroke-width': 1.6, 'stroke-linecap': 'round', opacity: 0.8 }, g));
    /* criotubo */
    const ct = el('g', { transform: 'translate(30 18) rotate(18)' }, g);
    el('path', { d: 'M-5 -12 L-5 13 C-5 18 5 18 5 13 L5 -12 Z', fill: '#f7fafc', stroke: '#8f9cab', 'stroke-width': 0.8 }, ct);
    el('path', { d: 'M-4.2 4 L-4.2 13 C-4.2 17 4.2 17 4.2 13 L4.2 4 Z', fill: '#e6f1f9' }, ct);
    el('rect', { x: -6.5, y: -21, width: 13, height: 10, rx: 2, fill: c }, ct);
    for (let i = 0; i < 4; i++) el('line', { x1: -5 + i * 3.3, y1: -20, x2: -5 + i * 3.3, y2: -12, stroke: mix(c, '#000000', 0.3), 'stroke-width': 0.6 }, ct);
    el('rect', { x: -4, y: -9, width: 8, height: 9, fill: '#ffffff', stroke: '#c9c2d4', 'stroke-width': 0.4 }, ct);
    for (let i = 0; i < 5; i++) el('rect', { x: -3 + i * 1.4, y: -7.5, width: 0.7, height: 6, fill: TINTA }, ct);
    /* escarcha */
    for (let i = 0; i < 10; i++) el('circle', { cx: f1(-26 + rng() * 52), cy: f1(-14 + rng() * 48), r: 0.9, fill: '#ffffff', opacity: 0.9 }, g);
  }
  function rutaInSitu(g, c) {
    /* la población en su sitio: lomas con milpa y teocintle, sol y el lindero de la reserva */
    el('rect', { x: -60, y: -60, width: 120, height: 120, fill: '#fbf8ee' }, g);
    el('circle', { cx: 24, cy: -26, r: 9, fill: '#f0c44e' }, g);
    el('path', { d: 'M-60 8 C-36 -18 -12 -14 6 2 C22 -16 44 -14 60 0 L60 60 L-60 60 Z', fill: linear('gLoma1', [['0%', mix(c, '#ffffff', 0.45)], ['100%', mix(c, '#ffffff', 0.15)]], { x1: 0, y1: 0, x2: 0, y2: 1 }) }, g);
    el('path', { d: 'M-60 26 C-30 12 10 14 60 22 L60 60 L-60 60 Z', fill: linear('gLoma2', [['0%', mix(c, '#000000', 0.05)], ['100%', mix(c, '#000000', 0.25)]], { x1: 0, y1: 0, x2: 0, y2: 1 }) }, g);
    const planta = (x, y, s, mazorca) => {
      const p = el('g', { transform: `translate(${x} ${y}) scale(${s})` }, g);
      el('path', { d: 'M0 0 L0 -34', stroke: '#3f7a2b', 'stroke-width': 1.8, 'stroke-linecap': 'round' }, p);
      [[-1, -8], [1, -14], [-1, -20], [1, -26]].forEach(([d, yy]) => el('path', { d: `M0 ${yy} q ${d * 10} -2 ${d * 15} -11 q ${-d * 4} 9 ${-d * 15} 11 Z`, fill: '#5f9e4a' }, p));
      el('path', { d: 'M-2 -34 l -2 -6 M0 -34 l 0 -7 M2 -34 l 2 -6', stroke: '#c98a4a', 'stroke-width': 1, 'stroke-linecap': 'round' }, p);
      if (mazorca) el('ellipse', { cx: 3.5, cy: -16, rx: 2.4, ry: 5, fill: '#4e4382', transform: 'rotate(-14 3.5 -16)' }, p);
    };
    planta(-30, 34, 0.9, true); planta(-14, 36, 1.05, true); planta(2, 35, 0.95, false); planta(-40, 18, 0.55, false); planta(36, 30, 0.7, false); planta(46, 33, 0.6, false);
    /* lindero de la reserva */
    el('path', { d: 'M-52 46 C-20 40 20 40 54 46', fill: 'none', stroke: TIERRA, 'stroke-width': 1.1, 'stroke-dasharray': '3 2.5' }, g);

  /* ---------------------------------------------------------------- agave espadín */
  function agave(x, y, s, rot) {
    const g = gr(x, y, s, rot);

      const rx = Math.cos(rad(a)), ry = Math.sin(rad(a)), nx = -ry, ny = rx;

  }

    [-40, -14, 30].forEach(yy => el('path', { d: `M-38 ${yy} q 6 3 10 0`, fill: 'none', stroke: '#4a331c', 'stroke-width': 0.8 }, g));
    /* florecillas en el tronco */
    [[-26, -36], [-24, -30], [-27, 38], [-23, 44]].forEach(([fx, fy]) => { for (let k = 0; k < 5; k++) el('ellipse', { cx: fx, cy: fy - 2.6, rx: 1, ry: 2.4, fill: '#f3d6dc', transform: `rotate(${k * 72} ${fx} ${fy})` }, g); el('circle', { cx: fx, cy: fy, r: 1, fill: '#c06a7a' }, g); });
    /* hoja */
    el('path', { d: 'M-24 -50 C0 -66 28 -64 40 -52 C20 -42 -4 -42 -24 -50 Z', fill: linear('gHojaCc', [['0%', '#a6cf7e'], ['100%', '#3f7a2b']]), stroke: '#2f5f20', 'stroke-width': 0.7 }, g);
    el('path', { d: 'M-24 -50 L38 -52', stroke: '#2f5f20', 'stroke-width': 0.6, opacity: 0.6 }, g);
    /* mazorca de cacao colgando del tronco: surcos profundos, superficie rugosa y punta aguda */
    el('path', { d: 'M-27 -34 C-18 -36 -8 -34 4 -28', fill: 'none', stroke: '#5f8f3a', 'stroke-width': 2.6, 'stroke-linecap': 'round' }, g);
    const mz = el('g', { transform: 'translate(6 10) rotate(-8)' }, g);
    const piel = radial('gCacao', [['0%', '#fde9a0'], ['40%', '#eeb03a'], ['80%', '#c7681c'], ['100%', '#8f3d14']], { r: '62%', fx: '34%', fy: '30%' });
    const forma = 'M0 -38 C15 -38 23 -20 23 2 C23 24 13 40 2 52 C-9 40 -23 24 -23 2 C-23 -20 -15 -38 0 -38 Z';
    const idCc = 'clCacao';
    el('path', { d: forma }, el('clipPath', { id: idCc }, defs));
    el('path', { d: forma, fill: piel }, mz);
    const sur = el('g', { 'clip-path': `url(#${idCc})` }, mz);
    [-17, -8.5, 0, 8.5, 17].forEach(k => {
      el('path', { d: `M${f1(k * 0.45)} -38 C${f1(k * 1.25)} -18 ${f1(k * 1.25)} 22 2 52`, fill: 'none', stroke: '#9a4a14', 'stroke-width': 1.4, opacity: 0.75 }, sur);
      el('path', { d: `M${f1(k * 0.45 + 2.6)} -36 C${f1(k * 1.25 + 3.4)} -18 ${f1(k * 1.25 + 3.4)} 22 3.5 50`, fill: 'none', stroke: '#fff2c4', 'stroke-width': 1.2, opacity: 0.45 }, sur);
    });
    for (let i = 0; i < 26; i++) el('ellipse', { cx: f1(-18 + rng() * 36), cy: f1(-30 + rng() * 70), rx: 1.3, ry: 0.9, fill: '#a2521a', opacity: 0.45 }, sur);
    el('path', { d: forma, fill: 'none', stroke: '#7a3410', 'stroke-width': 0.9 }, mz);
    el('path', { d: 'M-3 -38 L-2 -44 L3 -44 L3 -38 Z', fill: '#6b8f34' }, mz);
  }

  /* ---------------------------------------------------------------- chile de árbol: rama con frutos y flor */
  function chile(x, y, s, rot) {
    const g = gr(x, y, s, rot);
    el('path', { d: 'M-44 -36 C-20 -46 8 -44 40 -34', fill: 'none', stroke: '#4f7a2e', 'stroke-width': 2.2, 'stroke-linecap': 'round' }, g);
    const hoja = linear('gHojaChi', [['0%', '#b9dc8e'], ['100%', '#3f7a2b']]);
    [[-34, -40, -150, 20], [-14, -44, -30, 22], [6, -43, -150, 18], [26, -38, -24, 20]].forEach(([hx, hy, a, L]) => {
      const h = el('g', { transform: `translate(${hx} ${hy}) rotate(${a})` }, g);
      el('path', { d: `M0 0 C${L * 0.3} -6 ${L * 0.8} -5 ${L} 0 C${L * 0.8} 5 ${L * 0.3} 6 0 0 Z`, fill: hoja, stroke: '#2f5f20', 'stroke-width': 0.6 }, h);
      el('path', { d: `M1 0 L${L * 0.92} 0`, stroke: '#2f5f20', 'stroke-width': 0.5, opacity: 0.6 }, h);
    });
    /* frutos delgados y colgantes, del rojo encendido al vino */
    const piel = linear('gChile', [['0%', '#f26a3c'], ['45%', '#d1321e'], ['100%', '#8e1a10']], { x1: 0, y1: 0, x2: 1, y2: 0 });
    const fruto = (x0, y0, L, c) => {
      el('path', { d: `M${x0 - 4} ${y0} C${x0 - 5} ${y0 + L * 0.4} ${x0 + c - 2} ${y0 + L * 0.8} ${x0 + c} ${y0 + L} C${x0 + c + 1.2} ${y0 + L * 0.8} ${x0 + 5} ${y0 + L * 0.4} ${x0 + 4} ${y0} Z`, fill: piel, stroke: '#7a1a0f', 'stroke-width': 0.7 }, g);
      el('path', { d: `M${x0 - 1.6} ${y0 + 4} C${x0 - 2} ${y0 + L * 0.35} ${x0 + c * 0.4 - 1} ${y0 + L * 0.6} ${x0 + c * 0.7 - 1} ${y0 + L * 0.8}`, fill: 'none', stroke: '#ffffff', 'stroke-width': 1, opacity: 0.45, 'stroke-linecap': 'round' }, g);
      el('path', { d: `M${x0 - 5} ${y0 + 1} Q${x0} ${y0 - 4} ${x0 + 5} ${y0 + 1} L${x0 + 3} ${y0 + 4} L${x0 - 3} ${y0 + 4} Z`, fill: '#5f8f3a' }, g);
      el('path', { d: `M${x0} ${y0 - 2} Q${x0 + 1} ${y0 - 8} ${x0 - 1} ${y0 - 12}`, fill: 'none', stroke: '#5f8f3a', 'stroke-width': 1.6, 'stroke-linecap': 'round' }, g);
    };
    fruto(-22, -30, 62, 9); fruto(-4, -32, 70, -6); fruto(16, -28, 56, 12);
    /* flor blanca */
    const fl = el('g', { transform: 'translate(34 -22)' }, g);
    for (let k = 0; k < 5; k++) el('ellipse', { cx: 0, cy: -4.2, rx: 2.4, ry: 4.6, fill: '#fbfaf3', stroke: '#c9c5b0', 'stroke-width': 0.5, transform: `rotate(${k * 72})` }, fl);
    el('circle', { cx: 0, cy: 0, r: 1.8, fill: '#c9a83a' }, fl);
  }

  /* colocación a los lados de las rutas: cada dibujo cabe en una caja de unos 74 px de alto, sobre su rótulo */
  maiz(104, 369, 0.48, -12);      rotulo(104, 412, 'Zea mays', 'BLUE MAIZE');
  frijol(104, 492, 0.62, 0);      rotulo(104, 532, 'Phaseolus vulgaris', 'COMMON BEAN');
  calabaza(104, 604, 0.72, 0);    rotulo(104, 652, 'Cucurbita pepo', 'SQUASH');
  agave(104, 747, 0.75, 0);       rotulo(104, 772, 'Agave angustifolia', 'ESPADÍN AGAVE');
  chayote(748, 368, 0.5, 8);      rotulo(748, 412, 'Sechium edule', 'CHAYOTE');
  aguacate(748, 477, 0.65, 0);    rotulo(748, 532, 'Persea americana', 'AVOCADO');
  cacao(748, 599, 0.58, 0);       rotulo(748, 652, 'Theobroma cacao', 'CACAO');
  chile(748, 719, 0.85, 0);       rotulo(748, 772, 'Capsicum annuum', 'TREE CHILI');

  /* ============================================================ viñetas del programa */
  const VY = 806, VH = 132, VW = 168, VGAP = 15.5;
  const ejes = p => el('path', { d: 'M18 96 L150 96 M18 96 L18 16', fill: 'none', stroke: TINTA, 'stroke-width': 1 }, p);
  const Phi = z => { const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2); const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; };
  const vinetas = [
    ['Viability', 'when to regenerate', 8, (p) => {
      ejes(p);
      /* ecuación de viabilidad de Ellis y Roberts: v = Φ(Ki − p/σ) */
      const curva = [];
      for (let i = 0; i <= 60; i++) { const t = i / 60; curva.push([18 + t * 128, 96 - Phi(2.3 - 4.6 * t) * 76]); }
      el('path', { d: poly(curva) + ' L146 96 L18 96 Z', fill: mix(CHAYOTE, '#ffffff', 0.75) }, p);
      el('path', { d: poly(curva), fill: 'none', stroke: '#4f8a3c', 'stroke-width': 2.2 }, p);
      const yu = 96 - 0.85 * 76, tu = (2.3 - 1.0364) / 4.6, xu = 18 + tu * 128;
      el('line', { x1: 18, y1: f1(yu), x2: 150, y2: f1(yu), stroke: ROJO, 'stroke-width': 1, 'stroke-dasharray': '3 3' }, p);
      txt(150, yu - 4, '85 %', { sans: true, size: 7.5, color: ROJO, ancla: 'end', padre: p });
      el('line', { x1: f1(xu), y1: f1(yu), x2: f1(xu), y2: 96, stroke: GRIS, 'stroke-width': 0.8, 'stroke-dasharray': '2 2' }, p);
      el('circle', { cx: f1(xu), cy: f1(yu), r: 3.6, fill: '#ffffff', stroke: ROJO, 'stroke-width': 1.6 }, p);
      txt(f1(xu + 6), 90, 'regenerate', { sans: true, size: 7.5, color: GRIS, padre: p });
    }],
    ['Labels', 'Code 128 and QR', 9, (p) => {
      el('rect', { x: 14, y: 18, width: 152, height: 80, rx: 5, fill: '#ffffff', stroke: '#b9ab83', 'stroke-width': 1 }, p);
      el('rect', { x: 14, y: 18, width: 152, height: 9, rx: 3, fill: '#9a7414' }, p);
      txt(22, 42, 'MEX-ZM-0001', { sans: true, size: 9.5, peso: 600, color: TINTA, padre: p });
      const sp = txt(22, 54, '', { size: 9.5, color: TINTA, padre: p }); el('tspan', { 'font-style': 'italic' }, sp, 'Zea mays'); el('tspan', {}, sp, ' L.');
      let bx = 22;
      while (bx < 100) { const w = [0.7, 1.1, 1.6, 2.2][Math.floor(rng() * 4)]; el('rect', { x: f1(bx), y: 62, width: f1(w), height: 22, fill: TINTA }, p); bx += w + [0.7, 1.1, 1.6][Math.floor(rng() * 3)]; }
      txt(61, 92, 'MEX-ZM-0001', { sans: true, size: 5.2, color: GRIS, ancla: 'middle', esp: '0.16em', padre: p });
      /* QR ilustrativo: 21 × 21 módulos con sus tres marcas de posición */
      const q = el('g', { transform: 'translate(112 36)' }, p), m = 2.4, N = 21;
      el('rect', { x: -2, y: -2, width: N * m + 4, height: N * m + 4, fill: '#ffffff' }, q);
      const marca = (i, j) => (i < 8 && j < 8) || (i < 8 && j >= N - 8) || (i >= N - 8 && j < 8);
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (!marca(i, j) && rng() < 0.48) el('rect', { x: f1(j * m), y: f1(i * m), width: m, height: m, fill: TINTA }, q);
      [[0, 0], [0, N - 7], [N - 7, 0]].forEach(([i, j]) => {
        el('rect', { x: f1(j * m), y: f1(i * m), width: 7 * m, height: 7 * m, fill: TINTA }, q);
        el('rect', { x: f1(j * m + m), y: f1(i * m + m), width: 5 * m, height: 5 * m, fill: '#ffffff' }, q);
        el('rect', { x: f1(j * m + 2 * m), y: f1(i * m + 2 * m), width: 3 * m, height: 3 * m, fill: TINTA }, q);
      });
    }],
    ['Core collection', 'diversity in a few accessions', 7, (p) => {
      el('path', { d: 'M18 56 L150 56 M84 16 L84 96', fill: 'none', stroke: '#c9c2d4', 'stroke-width': 0.8 }, p);
      const grupos = [[52, 40, 16, 11], [118, 44, 18, 12], [70, 78, 18, 10], [126, 82, 12, 8]];
      const puntos = [];
      grupos.forEach(([gx, gy, sx, sy], k) => { for (let i = 0; i < 11; i++) { const a = rng() * Math.PI * 2, r = Math.sqrt(rng()); puntos.push([gx + Math.cos(a) * r * sx, gy + Math.sin(a) * r * sy, k]); } });
      puntos.forEach(([x, y]) => el('circle', { cx: f1(x), cy: f1(y), r: 2.3, fill: '#bdb3cc' }, p));
      /* el núcleo: dos o tres por grupo, repartidos a lo ancho del grupo */
      [0, 4, 9, 11, 15, 19, 22, 27, 33, 38].forEach(i => {
        const [x, y] = puntos[i];
        el('circle', { cx: f1(x), cy: f1(y), r: 5.2, fill: 'none', stroke: MAGENTA, 'stroke-width': 1.1 }, p);
        el('circle', { cx: f1(x), cy: f1(y), r: 2.8, fill: MAGENTA }, p);
      });
      txt(150, 106, 'PCoA 1', { sans: true, size: 7, color: GRIS, ancla: 'end', padre: p });
    }],
    ['Collecting gaps', 'where to collect next', 6, (p) => {
      /* rejilla sobre un territorio: el color dice la prioridad; los puntos, lo ya colectado */
      const terr = 'M22 34 C40 18 70 22 92 20 C120 18 150 24 156 44 C162 66 140 70 132 86 C122 104 92 100 70 96 C44 92 18 84 16 62 C14 48 16 40 22 34 Z';
      const id = 'clTerr';
      el('path', { d: terr }, el('clipPath', { id }, defs));
      const rej = el('g', { 'clip-path': `url(#${id})` }, p);
      const C = 14.5, prio = (i, j) => Math.max(0, Math.min(1, 0.45 + 0.55 * Math.sin(i * 0.9 + 1.2) * Math.cos(j * 0.8 - 0.4) + (rng() - 0.5) * 0.3));
      const prioridades = [];
      for (let j = 0; j < 6; j++) for (let i = 0; i < 10; i++) {
        const v = prio(i, j); prioridades.push([i, j, v]);
        el('rect', { x: f1(14 + i * C), y: f1(16 + j * C), width: C, height: C, fill: rampa(['#fbf6ec', '#f3d9a6', OCRE, ROJO], v), stroke: '#ffffff', 'stroke-width': 0.8 }, rej);
      }
      el('path', { d: terr, fill: 'none', stroke: TIERRA, 'stroke-width': 1.1 }, p);
      /* colectas existentes en las celdas de baja prioridad */
      prioridades.filter(([, , v]) => v < 0.28).slice(0, 9).forEach(([i, j]) => el('circle', { cx: f1(14 + (i + 0.5) * C), cy: f1(16 + (j + 0.5) * C), r: 2, fill: MORADO_OSC }, rej));
      /* ruta por las cuatro celdas de mayor prioridad, separadas al menos dos celdas entre sí */
      const top = [];
      prioridades.filter(([i, j]) => i > 0 && i < 9 && j > 0 && j < 5).sort((a, b) => b[2] - a[2]).forEach(c => {
        if (top.length < 4 && top.every(t => Math.max(Math.abs(t[0] - c[0]), Math.abs(t[1] - c[1])) >= 2)) top.push(c);
      });
      top.sort((a, b) => a[0] - b[0]);
      const rpts = top.map(([i, j]) => [14 + (i + 0.5) * C, 16 + (j + 0.5) * C]);
      el('path', { d: poly(rpts), fill: 'none', stroke: TINTA, 'stroke-width': 1.3, 'stroke-dasharray': '3 2.5' }, p);
      rpts.forEach(([x, y], k) => { el('circle', { cx: f1(x), cy: f1(y), r: 5.2, fill: '#ffffff', stroke: TINTA, 'stroke-width': 1.1 }, p); txt(f1(x), f1(y + 2.6), String(k + 1), { sans: true, size: 7, peso: 600, color: TINTA, ancla: 'middle', padre: p }); });
    }],
  ];
  vinetas.forEach(([titulo, pie, bloque, dibujo], i) => {
    const vx = 68 + i * (VW + VGAP);
    el('rect', { x: vx, y: VY, width: VW, height: VH, fill: '#fcfbfd', stroke: '#e0d9e8', 'stroke-width': 1, rx: 5 });
    el('rect', { x: vx, y: VY, width: VW, height: 3, fill: BLOQUES[bloque], rx: 1.5 });
    const p = el('g', { transform: `translate(${vx} ${VY + 6}) scale(0.86)` });
    dibujo(p, VW, VH);
    txt(vx + VW / 2, VY + VH - 20, titulo, { size: 13, peso: 600, color: TINTA, ancla: 'middle' });
    txt(vx + VW / 2, VY + VH - 8, pie, { sans: true, size: 8, color: GRIS, ancla: 'middle' });
  });

  /* ============================================================ pie */
  const FY = 968, FW = 714 / BLOQUES.length;
  BLOQUES.forEach((c, i) => el('rect', { x: f1(68 + i * FW), y: FY, width: f1(FW - 4), height: 7, fill: c, rx: 1.5 }));
  el('rect', { x: 68, y: FY + 24, width: 714, height: 1.2, fill: '#dcd3e6' });
  txt(68, FY + 54, 'Luis Ángel Barrera-Guzmán', { size: 19, peso: 600, color: TINTA });
  txt(68, FY + 78, '2026 · LICENSED UNDER GPL-3.0 OR LATER', { sans: true, size: 8.5, esp: '0.1em', color: GRIS });
  txt(782, FY + 78, 'Ten blocks, from passport to report', { size: 14, cursiva: true, color: MORADO_OSC, ancla: 'end' });
})();
</script>
